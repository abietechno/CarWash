# WashWuzz — nginx untuk tiga site (aaPanel).
# Dipasang oleh deploy/server-setup.sh ke /www/server/panel/vhost/nginx/carwash-cloud.conf
#
# Trafik publik masuk lewat Cloudflare Tunnel (HTTPS selesai di Cloudflare, tunnel -> http://localhost:80),
# jadi cukup listen 80. Host asli diteruskan cloudflared; Laravel memakainya untuk mengenali tenant.

# Landing page + API — https://carwash.cloudbizz.my.id
server {
    listen 80;
    server_name carwash.cloudbizz.my.id;
    root /www/wwwroot/carwash/CarWash/backend/public;
    index index.php;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/tmp/php-cgi-84.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /www/wwwlogs/carwash.cloudbizz.my.id.log;
    error_log /www/wwwlogs/carwash.cloudbizz.my.id.error.log;
}

# Dashboard tenant & super-admin — https://dash-admin.cloudbizz.my.id
server {
    listen 80;
    server_name dash-admin.cloudbizz.my.id;
    root /www/wwwroot/carwash/CarWash/dash-admin/dist;
    index index.html;
    charset utf-8;

    location ^~ /api/ {
        fastcgi_pass unix:/tmp/php-cgi-84.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/carwash/CarWash/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /www/wwwroot/carwash/CarWash/backend/public;
    }

    # Nama file hasil build Vite berisi hash, aman di-cache lama.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/dash-admin.cloudbizz.my.id.log;
    error_log /www/wwwlogs/dash-admin.cloudbizz.my.id.error.log;
}

# Situs publik tenant — https://{subdomain}.cloudbizz.my.id
# Nama persis (carwash, dash-admin, dan site aaPanel lain) selalu menang atas wildcard ini.
server {
    listen 80;
    server_name *.cloudbizz.my.id;
    root /www/wwwroot/carwash/CarWash/dist;
    index index.html;
    charset utf-8;

    location ^~ /api/ {
        fastcgi_pass unix:/tmp/php-cgi-84.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /www/wwwroot/carwash/CarWash/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /www/wwwroot/carwash/CarWash/backend/public;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/tenants.cloudbizz.my.id.log;
    error_log /www/wwwlogs/tenants.cloudbizz.my.id.error.log;
}
